# Wird von der GitHub Action (.github/workflows/worker-deploy.yml) benutzt.
# Die Datenbank-ID kommt dort aus dem Secret D1_DATABASE_ID.
name = "dispo-api"
main = "worker.js"
compatibility_date = "2025-09-01"

# Variablen und Secrets aus dem Cloudflare-Dashboard beim Deploy behalten
# (GUILD_ID, ALLOWED_ORIGIN, ROLLEN_…, BOT_TOKEN, PRC_SERVER_KEY).
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "dispo"
database_id = "HIER_DIE_D1_ID_EINTRAGEN"
