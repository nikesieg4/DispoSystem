# Nur nötig, wenn der Worker per Kommandozeile (npx wrangler deploy) statt
# über das Cloudflare-Dashboard eingerichtet wird.
name = "dispo-api"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
GUILD_ID = "1506205676136038491"
ALLOWED_ORIGIN = "https://nikesieg4.github.io"
