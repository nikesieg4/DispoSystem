<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispo · Berufsfeuerwehr NRW RP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 4C58 20 74 30 76 52C78 74 64 92 50 92C34 92 22 80 22 62C22 48 30 40 34 30C36 40 40 46 46 48C44 34 46 18 50 4Z' fill='%23E5484D'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Anmeldung -->
  <section id="login" class="login" hidden>
    <div class="login-card">
      <svg class="login-logo" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 4C58 20 74 30 76 52C78 74 64 92 50 92C34 92 22 80 22 62C22 48 30 40 34 30C36 40 40 46 46 48C44 34 46 18 50 4Z" fill="#E5484D"/>
        <path d="M50 40C56 52 64 58 64 70C64 82 58 88 50 88C42 88 36 82 36 72C36 64 42 60 44 52C46 58 48 60 50 60C49 54 48 48 50 40Z" fill="#FFC23D"/>
      </svg>
      <h1>Dispo-Karte</h1>
      <p class="muted">Berufsfeuerwehr NRW RP</p>
      <button id="login-btn" class="btn-discord" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18.2 18.2 0 0 0-5.5 0L8.7 3a19.5 19.5 0 0 0-4.9 1.5C.7 9.1-.2 13.6.3 18a19.7 19.7 0 0 0 6 3l1.3-2a12.7 12.7 0 0 1-2-1l.5-.4a14 14 0 0 0 11.9 0l.5.4-2 1 1.3 2a19.6 19.6 0 0 0 6-3c.5-5.1-.8-9.6-3.5-13.6ZM8 15.3c-1.2 0-2.1-1.1-2.1-2.4S6.8 10.5 8 10.5s2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Zm8 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.2 1.1 2.1 2.4c0 1.3-.9 2.4-2.1 2.4Z"/></svg>
        Mit Discord anmelden
      </button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </div>
  </section>

  <!-- Hauptansicht -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4C58 20 74 30 76 52C78 74 64 92 50 92C34 92 22 80 22 62C22 48 30 40 34 30C36 40 40 46 46 48C44 34 46 18 50 4Z" fill="#E5484D"/></svg>
        <span>Dispo · BF NRW RP</span>
      </div>
      <span id="stand" class="muted small"></span>
      <div class="user">
        <img id="user-avatar" alt="" width="28" height="28">
        <span id="user-name"></span>
        <button id="logout-btn" class="btn-ghost" type="button">Abmelden</button>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="fahrzeuge" aria-selected="true">Fahrzeuge</button>
        <button class="tab" role="tab" data-tab="bereiche" aria-selected="false">Bereiche</button>
      </nav>

      <div id="tab-fahrzeuge" class="tab-panel">
        <div id="status-filter" class="status-filter" aria-label="Nach Status filtern"></div>
        <div id="fahrzeug-liste"></div>
      </div>

      <div id="tab-bereiche" class="tab-panel" hidden>
        <label class="check"><input type="checkbox" id="toggle-bereiche" checked> Bereiche auf der Karte zeigen</label>
        <div id="bereich-liste"></div>
      </div>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <button id="coord-btn" class="map-btn" type="button" aria-pressed="false">Koordinaten</button>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
